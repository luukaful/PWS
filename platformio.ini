[platformio]
default_envs = raylib-opi

[env:raylib-opi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Quad-SPI flash en octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; Vastgezette versies waarop de proefcode is gebaseerd.
lib_deps =
    raylib-esp32 = https://github.com/jensroth-git/raylib-esp32.git#63db94b3f9ff8ef9d4f04ed97520a77eeeebd9ff
    TFT_eSPI = https://github.com/Bodmer/TFT_eSPI.git#16e37595040eac69cd628e4bffb56fc30cad6299

; Schakel PSRAM in en laad onze TFT-configuratie.
build_flags =
    -DBOARD_HAS_PSRAM
    -include include/PwsTftSetup.h

; Koppel raylib aan TFT_eSPI en corrigeer de port-initialisatie.
extra_scripts = pre:scripts/raylib_tft.py


; Dit is een kopie van de originele platformio.ini (kopieer naar .pio/libdeps/esp32-s3-devkitc-1/TFT_eSPI/User_Setup.h)